[package]
name = "anvil-props"
description = "AnvilCAD file properties: shows and bulk-converts SOLIDWORKS custom properties without SOLIDWORKS"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "anvil-props"
path = "src/main.rs"

[dependencies]
anvil-io.workspace = true
anvil-model.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
anvil-io = { workspace = true, features = ["fixtures"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
panic = "warn"
