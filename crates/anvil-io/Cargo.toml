[package]
name = "anvil-io"
description = "AnvilCAD import/export: STL, OBJ, STEP, SOLIDWORKS file detection and file properties"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Writers for building compound-file and property-set test files.
fixtures = []

[dependencies]
anvil-kernel.workspace = true
anvil-model.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant"] }
