[package]
name = "anvil-drawing"
description = "AnvilCAD drawings: sheets, standard views projected from exact part geometry with hidden lines removed, dimensions, title blocks, and vector PDF and DXF export"
version.workspace = true
edition = "2024"
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
anvil-brep.workspace = true
anvil-model.workspace = true
anvil-kernel.workspace = true
anvil-sketch.workspace = true
glam = "0.34"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
panic = "warn"
