[package]
name = "anvil-migrate"
description = "AnvilCAD SOLIDWORKS migrator: reads parts through the SOLIDWORKS API and writes AnvilCAD documents"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "anvil-migrate"
path = "src/main.rs"

[dependencies]
anvil-kernel.workspace = true
anvil-sketch.workspace = true
anvil-model.workspace = true
anvil-io.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
panic = "warn"
