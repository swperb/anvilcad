[package]
name = "proveout-web"
description = "The Proveout web site: CNC program checks, AI review through the Claude API, setup sheets, accounts and plans"
version.workspace = true
edition = "2024"
license.workspace = true
publish = false

[[bin]]
name = "proveout"
path = "src/main.rs"

[dependencies]
proveout-core = { path = "../proveout-core" }
anvil-cam = { path = "../anvil-cam", features = ["ai"] }
serde.workspace = true
serde_json.workspace = true
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
rusqlite = { version = "0.37", features = ["bundled"] }
argon2 = "0.5"
getrandom = "0.3"
sha2 = "0.11"
base64 = "0.22"
ureq = { version = "3.4", default-features = false, features = ["rustls"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
panic = "warn"
