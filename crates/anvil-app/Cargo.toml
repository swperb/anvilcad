[package]
name = "anvil-app"
description = "AnvilCAD desktop application"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "anvilcad"

[lib]
name = "anvil_app"
path = "src/lib.rs"

[[bin]]
name = "anvilcad"
path = "src/main.rs"

# Drives the app without a window, for agents and automated tests (see docs/AGENT_HARNESS.md).
[[bin]]
name = "anvilcad-agent"
path = "src/bin/anvilcad-agent.rs"

[dependencies]
anvil-kernel.workspace = true
anvil-sketch.workspace = true
anvil-model.workspace = true
anvil-io.workspace = true
eframe = { version = "=0.31.1", default-features = false, features = ["accesskit", "wgpu", "default_fonts", "wayland", "x11"] }
# The accessibility tree (also used by screen readers) lets the headless harness find
# widgets by their labels.
egui = { version = "=0.31.1", default-features = false, features = ["accesskit"] }
bytemuck = "1"
rfd = "0.15"
png = "0.17"
pollster = "0.4"
serde_json.workspace = true
# init.lua and scripts (docs/SCRIPTING.md). Lua 5.4 is compiled in, so users install nothing.
mlua = { version = "0.12", features = ["lua54", "vendored", "serde"] }

# eframe builds wgpu without its DX12 backend, which leaves Windows with only Vulkan and
# OpenGL: a machine with no Vulkan driver (a VM, Remote Desktop, an older GPU) then finds no
# adapter at all, for the window or for headless screenshots. DX12 also brings WARP, the
# software rasteriser every Windows install has. This only adds a feature to eframe's wgpu.
[target.'cfg(windows)'.dependencies]
wgpu = { version = "24.0.5", default-features = false, features = ["dx12"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
panic = "warn"
