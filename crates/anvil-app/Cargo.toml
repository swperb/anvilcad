[package]
name = "anvil-app"
description = "AnvilCAD desktop application"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "anvilcad"
path = "src/main.rs"

[dependencies]
anvil-kernel.workspace = true
anvil-sketch.workspace = true
anvil-model.workspace = true
anvil-io.workspace = true
eframe = { version = "=0.31.1", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
bytemuck = "1"
rfd = "0.15"
png = "0.17"
