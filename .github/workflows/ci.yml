name: CI

# Branch pushes are covered by the pull_request run, so only build main on push.
# This halves the work: a branch with an open PR no longer runs CI twice per commit.
on:
  push:
    branches: [main]
  pull_request:

# A newer commit on the same branch or PR cancels the superseded run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Incremental compilation only helps across edits on one machine; in CI it just adds
  # overhead and bloats the cache.
  CARGO_INCREMENTAL: "0"

jobs:
  # Format and lint once, on Linux. These do not vary by OS (bar cfg-gated platform code,
  # which the per-OS test build still compiles).
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libgtk-3-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets

  test:
    strategy:
      # Run every OS to the end even if one fails, so a platform-specific failure is seen
      # on all platforms in one go.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # mesa-vulkan-drivers gives the headless harness a software GPU for its render test.
      - name: Linux GUI dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libgtk-3-dev mesa-vulkan-drivers
      - run: cargo test --workspace
