name: CI

# Pushes are built only on main; other branches are built through their pull request, so a
# branch with an open pull request is not built twice.
on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same pull request cancels the run it supersedes. Each run on main gets
# a group of its own, so none is cancelled or held back and every commit on main is tested.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Debug info is not needed to build and test in CI. Leaving it out cut a cold build's CPU
# time by about a quarter and its target/ from 1.5 GB to 660 MB, so the per-OS caches stay
# well inside the repository's 10 GB and restore faster.
env:
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # Caches the cargo registry and target/ in the free GitHub Actions cache, keyed by OS,
      # toolchain and Cargo.lock. Pull requests read main's cache.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # mesa-vulkan-drivers gives the headless harness a software GPU for its render test.
      - name: Linux GUI dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libgtk-3-dev mesa-vulkan-drivers
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace
