name: Release

# Builds the installable packages (packaging/package.sh) on each platform.
#
# - Pushing a tag such as v0.2.0 builds them and attaches them to a GitHub Release for
#   that tag.
# - A manual run (Actions > Release > Run workflow) and pull requests that change the
#   packaging build them as a dry run: the packages are kept as workflow artifacts for a
#   week and nothing is published.
#
# Cost: nothing. It uses only the standard GitHub-hosted runners (ubuntu-latest,
# windows-latest, macos-latest), which are free for public repositories, and free tools
# (WiX Toolset 5, appimagetool), and calls no paid service. It runs only for a tag, a
# manual run, or a pull request that touches the packaging, not on every push.
#
# macOS signing and notarization use the maintainer's Apple Developer Program membership,
# which is paid for already; Apple charges nothing per signature or notarization. They run
# only when the secrets below are set, and never for pull requests (a dry run does not need
# them, and pull requests from forks get no secrets). Without them the app gets an ad-hoc
# signature, so forks still build. The secrets:
#
#   MACOS_CERTIFICATE_P12        the "Developer ID Application" certificate with its private
#                                key, exported from Keychain Access as .p12, base64-encoded
#   MACOS_CERTIFICATE_PASSWORD   the password chosen for that export
#   APPLE_TEAM_ID                the ten-character team id
#   and, for notarization, either an App Store Connect API key:
#   NOTARY_API_KEY_P8            the AuthKey_XXXXXXXXXX.p8 file, base64-encoded
#   NOTARY_API_KEY_ID            its key id
#   NOTARY_API_ISSUER            the issuer id shown above the list of keys
#   or an Apple ID:
#   NOTARY_APPLE_ID              the Apple ID's email address
#   NOTARY_APP_PASSWORD          an app-specific password for it (account.apple.com)
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "packaging/**"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # A tag names the version; other runs use the version in Cargo.toml.
  VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      # Imports the certificate into a temporary keychain, stores the notary credentials
      # in it, and tells package.sh to use them. Without a certificate, and for pull
      # requests, it does nothing and the build is ad-hoc signed.
      - name: Signing keychain
        if: github.event_name != 'pull_request'
        env:
          P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          API_KEY_P8: ${{ secrets.NOTARY_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          API_ISSUER: ${{ secrets.NOTARY_API_ISSUER }}
          APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          APP_PASSWORD: ${{ secrets.NOTARY_APP_PASSWORD }}
        run: |
          if [ -z "$P12" ] || [ -z "$TEAM_ID" ]; then
            echo "::notice::No signing certificate is configured; the macOS build is ad-hoc signed and not notarized."
            exit 0
          fi
          kc="$RUNNER_TEMP/signing.keychain-db"
          kc_password="$(uuidgen)"
          security create-keychain -p "$kc_password" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kc_password" "$kc"
          echo "ANVIL_KEYCHAIN=$kc" >> "$GITHUB_ENV"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$kc_password" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$kc" \
            | grep -o "\"Developer ID Application: .*($TEAM_ID)\"" | tr -d '"' | head -n 1)"
          if [ -z "$identity" ]; then
            echo "::error::MACOS_CERTIFICATE_P12 holds no Developer ID Application identity for team $TEAM_ID."
            exit 1
          fi
          echo "ANVIL_MACOS_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

          if [ -n "$API_KEY_P8" ]; then
            echo "$API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
            xcrun notarytool store-credentials anvilcad-notary --keychain "$kc" \
              --key "$RUNNER_TEMP/notary.p8" --key-id "$API_KEY_ID" --issuer "$API_ISSUER"
            rm -f "$RUNNER_TEMP/notary.p8"
          elif [ -n "$APPLE_ID" ]; then
            xcrun notarytool store-credentials anvilcad-notary --keychain "$kc" \
              --apple-id "$APPLE_ID" --team-id "$TEAM_ID" --password "$APP_PASSWORD"
          else
            echo "::warning::No notary credentials are configured; the macOS build is signed but not notarized."
            exit 0
          fi
          echo "ANVIL_NOTARY_PROFILE=anvilcad-notary" >> "$GITHUB_ENV"
      - run: bash packaging/package.sh macos "$VERSION"
      - name: Remove the signing keychain
        if: always() && env.ANVIL_KEYCHAIN != ''
        run: security delete-keychain "$ANVIL_KEYCHAIN"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*
          retention-days: 7

  # Built in an Ubuntu 22.04 container (on the free ubuntu-latest runner) so the binaries
  # need only glibc 2.35 and run on older distributions too.
  linux:
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    steps:
      - name: Build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl file git pkg-config \
            libgtk-3-dev libwayland-dev libxkbcommon-dev
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: bash packaging/package.sh linux "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*
          retention-days: 7

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Pinned to WiX 5 (MS-RL, free). From version 6 the WiX project asks companies that
      # earn money from it for a maintenance fee, so this stays on 5.
      - name: WiX Toolset
        run: |
          dotnet tool install --global wix --version 5.0.2
          echo "$USERPROFILE/.dotnet/tools" >> "$GITHUB_PATH"
      - run: bash packaging/package.sh windows "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*
          retention-days: 7

  release:
    if: github.ref_type == 'tag'
    needs: [macos, linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            pre=""
            case "$TAG" in *-*) pre="--prerelease" ;; esac
            gh release create "$TAG" dist/* --verify-tag --generate-notes --title "AnvilCAD ${TAG#v}" $pre
          fi
