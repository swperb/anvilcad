[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
anvil-kernel = { path = "crates/anvil-kernel" }
anvil-sketch = { path = "crates/anvil-sketch" }
anvil-model = { path = "crates/anvil-model" }
anvil-io = { path = "crates/anvil-io" }
anvil-brep = { path = "crates/anvil-brep" }
anvil-step = { path = "crates/anvil-step" }

# Geometry code is numerically heavy, so keep dependencies optimized even in dev builds.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

# The exact kernel is tested with many randomized cases; optimize it in test builds too.
[profile.dev.package.anvil-brep]
opt-level = 2
